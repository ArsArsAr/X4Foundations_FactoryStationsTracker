<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Production chain planner for X4: Foundations. See what a ware needs, track what you have built, find shortfalls.">
<title>X4 Factories Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131619'/%3E%3Cpath d='M11 10h5v6h5M11 22h5v-6' fill='none' stroke='%2339414a' stroke-width='2'/%3E%3Crect x='5' y='7' width='7' height='6' rx='1.5' fill='%23a9b1ba'/%3E%3Crect x='5' y='19' width='7' height='6' rx='1.5' fill='%23a9b1ba'/%3E%3Crect x='20' y='12' width='8' height='8' rx='2' fill='%234fcab9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">X4</span>
      <span class="brand-name">Factories Planner</span>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="topbar-actions">
      <button type="button" class="btn" id="export-data" title="Save your built modules to a file"><span data-icon="download-simple"></span>Export</button>
      <button type="button" class="btn" id="import-data" title="Load built modules from a file"><span data-icon="upload-simple"></span>Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button type="button" class="btn" id="clear-data" title="Clear everything you have marked as built"><span data-icon="arrow-counter-clockwise"></span><span id="clear-data-label">Reset</span></button>
    </div>
  </header>

  <div id="layout">

    <aside id="sidebar" aria-label="Wares">
      <div class="search-field">
        <label for="search" class="sr-only">Search wares</label>
        <span class="search-icon" data-icon="magnifying-glass"></span>
        <input type="search" id="search" placeholder="Search wares" autocomplete="off" spellcheck="false">
        <kbd title="Press / to search">/</kbd>
      </div>
      <div class="segmented" role="group" aria-label="Show wares">
        <button type="button" data-filter="all" aria-pressed="true">All <span class="num" id="count-all"></span></button>
        <button type="button" data-filter="built" aria-pressed="false">Built <span class="num" id="count-built"></span></button>
      </div>
      <div id="ware-list"></div>
      <p id="ware-empty" class="quiet-note" hidden></p>
    </aside>

    <main id="chain-view">
      <div id="chain-bar" hidden>
        <div class="chain-heading">
          <h1 id="chain-name"></h1>
          <p id="chain-sub"></p>
        </div>
        <div class="target" role="group" aria-label="Target output">
          <span class="target-label">Target</span>
          <span class="target-modules" id="target-modules-wrap">
            <span class="stepper">
              <button type="button" id="target-dec" aria-label="One module less" data-fk="target:dec"><span data-icon="minus"></span></button>
              <input type="number" id="target-modules" min="0" step="1" inputmode="decimal" aria-label="Target in modules" data-fk="target:modules">
              <button type="button" id="target-inc" aria-label="One module more" data-fk="target:inc"><span data-icon="plus"></span></button>
            </span>
            <span class="target-unit" id="target-modules-unit">modules</span>
            <span class="target-eq">=</span>
          </span>
          <input type="number" class="num-input" id="target-rate" min="1" step="1" inputmode="decimal" aria-label="Target in units per hour" data-fk="target:rate">
          <span class="target-unit">per hour</span>
          <button type="button" class="btn" id="target-match" data-fk="target:match" hidden></button>
        </div>
      </div>

      <div id="chain-canvas">
        <div id="empty-state">
          <h1>Pick a ware to plan its production chain</h1>
          <p>You get every input down to what you mine, sized for the output you want, next to what you have already built.</p>
          <div class="quick-picks" id="quick-picks" aria-label="Common end products"></div>
        </div>
        <div id="chain-scroll" hidden>
          <svg id="chain-lines" aria-hidden="true"></svg>
          <div id="chain-columns"></div>
        </div>
      </div>
    </main>

    <aside id="details" aria-label="Ware details" hidden>
      <div id="details-content"></div>
    </aside>

  </div>

  <footer id="network" class="collapsed">
    <button type="button" id="network-toggle" aria-expanded="false" aria-controls="network-body">
      <span class="network-title">My network</span>
      <span id="network-summary"></span>
      <span class="caret" data-icon="caret-down"></span>
    </button>
    <div id="network-body">
      <section class="net-col" aria-labelledby="net-built-title">
        <h2 id="net-built-title">Built modules</h2>
        <div id="built-list"></div>
      </section>
      <section class="net-col" aria-labelledby="net-balance-title">
        <h2 id="net-balance-title">Supply and demand</h2>
        <div id="balance-list"></div>
      </section>
      <section class="net-col" aria-labelledby="net-next-title">
        <h2 id="net-next-title">Next build</h2>
        <div id="suggest-list"></div>
      </section>
    </div>
  </footer>

</div>

<script src="data/wares.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
